name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every job below sets `timeout-minutes`. GitHub's default is 360 (six
  # hours), which is not a timeout so much as a billing event: on 2026-07-24
  # the `desktop` job hung at "Run Rust tests" on two separate runs and would
  # have burned the full six hours each time before failing. Both passed on a
  # plain re-run, so the hang is intermittent and its cause is still unknown.
  #
  # These values do not fix that. They convert a silent multi-hour stall into a
  # fast, visible failure you can re-run — which is the difference between
  # noticing a flake and waiting out a workday for one.
  #
  # Each limit is roughly 5-10x the observed warm-cache runtime, so a cold
  # cache (the legitimate slow case — a full Tauri dependency build) still has
  # generous headroom. If a job starts timing out for real, raise it
  # deliberately; do not raise it reflexively to make a hang go away.

  web:
    name: web (build + guard + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15   # ~2 min warm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Reproducible install from the committed lockfile.
      - run: npm ci
      - run: npm run build:solo
      - run: npm run test:build   # static import-graph guard
      - run: npm run test:js      # unit + integration tests

  log-phi-guard:
    name: log PHI guardrail
    # Lightweight standalone job: just checkout + a grep. Kept separate so it
    # never adds time to the web/desktop build jobs, and its failure points
    # straight at the offending log:: line. See scripts/check_log_phi.sh for
    # what it enforces and its (intentional) bluntness.
    runs-on: ubuntu-latest
    timeout-minutes: 5    # ~5 s warm; a grep that runs for minutes is broken
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check_log_phi.sh

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10   # ~20 s warm; the registry is the only slow part
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail only on high/critical advisories in JS deps.
      - run: npm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      # Scan both Rust lockfiles (desktop app + sync service).
      #
      # Ignored advisories on src-tauri:
      #   RUSTSEC-2026-0194 / RUSTSEC-2026-0195 — both are DoS bugs in
      #   quick-xml < 0.41.0. quick-xml is pulled in transitively via
      #   tauri -> plist and via wayland-scanner; neither has a released
      #   version yet that bumps to ≥ 0.41.0, so we can't cargo update our
      #   way out. Revisit on the next Tauri release and drop the ignores
      #   once quick-xml ≥ 0.41.0 resolves through the tree.
      - run: |
          cargo audit --file src-tauri/Cargo.lock \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195
      - run: cargo audit --file server/Cargo.lock

      # An ignore with no expiry is how a suppression list rots: in a year
      # nobody knows whether these are still unfixable or merely still
      # ignored, and "revisit on the next Tauri release" is a person
      # remembering, not a control.
      #
      # Re-run WITHOUT the ignores and report the result without failing the
      # job. When the tree finally resolves quick-xml >= 0.41.0 this step goes
      # quiet, which is the signal to delete the two --ignore flags above. If
      # a NEW advisory appears against src-tauri it is caught by the gating
      # run above, not here, so this step staying green-but-noisy never masks
      # a real finding.
      - name: Report whether the ignored advisories are still unavoidable
        continue-on-error: true
        run: |
          if cargo audit --file src-tauri/Cargo.lock --quiet; then
            echo "::warning::RUSTSEC-2026-0194/0195 no longer fire — remove the --ignore flags in ci.yml."
          else
            echo "Ignored advisories still present; the --ignore flags above are still required."
          fi

  server:
    name: server (tahlk-sync)
    runs-on: ubuntu-latest
    timeout-minutes: 25   # ~25 s warm, but a cold Rust build is the slow case
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build --manifest-path server/Cargo.toml --locked

  desktop:
    name: desktop (src-tauri check)
    # Pinned to 22.04 because libwebkit2gtk-4.1-dev is straightforward here;
    # 24.04 needs extra steps for that package.
    runs-on: ubuntu-22.04
    # ~3.5 min warm. This is the job that hung twice on 2026-07-24 at the
    # "Run Rust tests" step; 40 minutes leaves room for a genuinely cold Tauri
    # dependency build while still failing a hang inside the hour.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 Linux system deps (WebKitGTK 4.1, appindicator, rsvg).
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            file \
            wget

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Build the web frontend so frontendDist (../dist-solo) exists for
      # tauri-build validation.
      - run: npm ci
      - run: npm run build:solo

      # tauri-build validates externalBin AND resources paths on every
      # cargo invocation (not only at bundle time). The real whisper.cpp
      # sidecar and model are gitignored and placed manually for local
      # builds; in CI we drop zero-byte placeholders so build.rs is
      # satisfied. `cargo check` never reads them; only the tauri bundler
      # would, and bundling stays manual.
      #
      # Windows-only DLLs live in tauri.windows.conf.json and are merged
      # only when targeting Windows, so no stubs are needed on Linux CI.
      - name: Stub whisper sidecar + model for CI
        run: |
          mkdir -p src-tauri/binaries src-tauri/resources
          # externalBin: needs the target-triple suffix.
          touch src-tauri/binaries/whisper-cpp-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/whisper-cpp-x86_64-unknown-linux-gnu
          # resources map from tauri.conf.json.
          touch src-tauri/resources/ggml-base.en.bin

      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets

      # Lint as an error, not advice. The tree was carrying 26 clippy warnings,
      # which is how a real one hides: nobody reads warning 14 of 26. Genuine
      # exceptions carry a scoped #[allow] and a comment saying why, so the
      # reasoning is reviewable at the site instead of implied by silence.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      # `cargo test` needs a Secret Service provider. auth::set_password writes
      # the password hash to the OS keychain (auth.rs), secrets stores the
      # Anthropic key there, and lock stores the idle-lock PIN — all via the
      # `keyring` crate, which errors at `Entry::new` on a headless runner with
      # no D-Bus session. gnome-keyring supplies one for the duration of the
      # test run; nothing is persisted beyond the job.
      #
      # This is why the suite could not previously run here. It is worth the
      # setup: the tests it unblocks cover DEK wrapping, recovery codes,
      # signed-row immutability and the litigation hold — the controls that
      # protect PHI at rest. `cargo check` alone compiles them and runs none.
      - name: Install keyring backend for tests
        run: sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11

      # The hang this guards against (diagnosed 2026-07-24, from the logs of
      # runs 30123854563 and 30127946308):
      #
      # If the `--unlock`ed daemon is no longer the owner of
      # `org.freedesktop.secrets` when the first keychain call arrives — which
      # is ~2 minutes in, after cargo finishes compiling — D-Bus *activates a
      # replacement*. That replacement never received the `echo ""` password,
      # so its collection is LOCKED. Serving the request then needs a GUI
      # unlock prompt; `gcr-prompter` dies instantly with "cannot open
      # display", and the client (keyring -> dbus-secret-service -> dbus)
      # blocks with no timeout. Observed stalling 44+ minutes.
      #
      # The tell is unambiguous and worth knowing: the string
      # "Activating service name='org.freedesktop.secrets'" appeared in 2/2
      # hung runs and 0/4 passing runs. Activation only happens when nobody
      # owns the name, so its presence means the daemon had died — whether or
      # not that run went on to hang. The canary step below fails the job on
      # it, which turns every run into a signal instead of only the ~1 in 3
      # that stalled visibly.
      #
      # Three layers, because no single one is sufficient:
      #   1. `eval` the daemon's own output. It prints the control-socket and
      #      agent env vars, which were previously discarded — exporting them
      #      keeps clients pointed at the daemon we unlocked.
      #   2. `gdbus wait` gates on the name actually being claimed, so a
      #      daemon that failed to start fails here, fast and legibly, instead
      #      of at an arbitrary point mid-suite.
      #   3. `timeout` bounds the stall regardless of cause. Neither 1 nor 2
      #      can stop a daemon that dies *during* the run, so this is the
      #      backstop that converts a 40-minute stall into a 10-minute failure.
      - name: Run Rust tests
        run: |
          dbus-run-session -- sh -c '
            eval "$(echo "" | gnome-keyring-daemon --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL SSH_AUTH_SOCK
            gdbus wait --session --timeout 30 org.freedesktop.secrets
            timeout 600 cargo test --manifest-path src-tauri/Cargo.toml --locked
          ' 2>&1 | tee rust-test.log
          # Fail loudly if the daemon died and a locked replacement was
          # activated, even when the suite happened to finish anyway. A green
          # run that tripped this is a hang that got lucky on timing.
          if grep -q "Activating service name='org.freedesktop.secrets'" rust-test.log; then
            echo "::error::gnome-keyring died mid-run; D-Bus activated a LOCKED replacement."
            echo "::error::This is the CI hang signature — see the comment above this step."
            exit 1
          fi

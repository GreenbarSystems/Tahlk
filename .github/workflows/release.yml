name: Build and release

# Tag-triggered release for the signed Windows installer.
#
# The release is created in DRAFT state — a human runs the clean-Windows-VM
# QA pass (docs/RELEASE.md, "Final QA gate": record -> transcribe -> generate
# note -> sign -> export) and publishes the draft only once that passes.
# Signing uses Azure Artifact Signing (account "ryanmoore-codesign", profile
# "greenbar-public-signing") via `artifact-signing-cli`, wired through Tauri's
# signCommand in src-tauri/tauri.release.conf.json (see docs/RELEASE.md
# "Drop-in B").

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Fail fast — before paying for Node/Rust install and the Tauri
      # compile — on a malformed signing secret. A stray whitespace
      # character pasted into a secret is the failure mode that cost the
      # most debugging time historically, so it's checked explicitly here
      # rather than surfacing as an opaque `trusted-signing-cli` auth error
      # 10 minutes into the build.
      - name: Validate Azure signing secrets
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $guidPattern = '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          $failures = @()

          foreach ($name in @('AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_SUBSCRIPTION_ID')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              $failures += "$name is missing or empty."
            } elseif ($value -notmatch $guidPattern) {
              $failures += "$name is not a well-formed GUID (check for stray whitespace or a copy-paste error)."
            }
          }

          $clientSecret = $env:AZURE_CLIENT_SECRET
          if ([string]::IsNullOrWhiteSpace($clientSecret)) {
            $failures += "AZURE_CLIENT_SECRET is missing or empty."
          } elseif ($clientSecret -ne $clientSecret.Trim()) {
            $failures += "AZURE_CLIENT_SECRET has leading/trailing whitespace - re-save it as a single trimmed value."
          }

          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "Azure signing secrets look well-formed."

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Lock gates (test:build + test:js)
        run: |
          npm run test:build
          npm run test:js

      # test:build proves the three in-repo versions agree with each other. It
      # cannot see the git tag, and the tag is what names the GitHub Release
      # and what a tester will quote back in a bug report. A tag that disagrees
      # with the version stamped into the installer means the release is
      # labelled one thing and reports itself as another — with no auto-update
      # channel, that ambiguity survives for the whole life of the build.
      #
      # Pre-release suffixes are allowed on the tag and only on the tag:
      # v0.1.2-rc.1 is a legitimate way to exercise this workflow without
      # claiming to be 0.1.2, and NSIS cannot carry the suffix anyway.
      - name: Tag matches the packaged version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          $packaged = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $stripped = $tag -replace '^v', '' -replace '-.*$', ''
          if ($stripped -ne $packaged) {
            Write-Host "::error::tag $tag implies version $stripped but tauri.conf.json packages $packaged"
            Write-Host "::error::Bump package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json to match the tag, or retag."
            exit 1
          }
          Write-Host "tag $tag matches packaged version $packaged"

      # The whisper sidecar, its DLLs, and the model are gitignored (see
      # SETUP.md) and not hosted anywhere else yet — CI fetches the same
      # public releases a developer would grab by hand.
      #
      # Both downloads are PINNED and CHECKSUMMED, because the artifacts they
      # fetch end up inside a binary we then Authenticode-sign. The model alone
      # is 147 MB of the ~160 MB installer. Fetching it from a mutable URL and
      # signing whatever came back would make the signature attest to bytes
      # nobody chose — the certificate would vouch for a supply chain we do not
      # control. A signature over unverified content is worse than no
      # signature, because it looks like assurance.
      #
      # The model URL is pinned to an immutable HuggingFace commit rather than
      # `main`; a GitHub release asset can also be replaced in place, so the
      # zip is hashed too. If either hash moves, the build FAILS rather than
      # quietly shipping different bytes under the same version number.
      #
      # Hashes are recorded in docs/RELEASE.md. To roll the model forward:
      # update the commit, download it, hash it, update both places together.
      - name: Download whisper.cpp sidecar + DLLs
        shell: pwsh
        env:
          WHISPER_ZIP_SHA256: '7D8BE46ECD31828E1EB7A2ECDD0D6B314FEAFD82163038AB6092594B0A063539'
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.1/whisper-bin-x64.zip' -OutFile whisper-bin-x64.zip
          $actual = (Get-FileHash whisper-bin-x64.zip -Algorithm SHA256).Hash
          if ($actual -ne $env:WHISPER_ZIP_SHA256) {
            Write-Host "::error::whisper-bin-x64.zip checksum mismatch. expected=$($env:WHISPER_ZIP_SHA256) actual=$actual"
            Write-Host "::error::Refusing to sign an installer containing unverified third-party binaries."
            exit 1
          }
          Expand-Archive -Path whisper-bin-x64.zip -DestinationPath whisper-extracted
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item whisper-extracted/Release/whisper-cli.exe src-tauri/binaries/whisper-cpp-x86_64-pc-windows-msvc.exe
          Copy-Item whisper-extracted/Release/*.dll src-tauri/binaries/

      - name: Download Whisper base.en model
        shell: pwsh
        env:
          # HuggingFace repo commit for ggerganov/whisper.cpp, resolved via the
          # HF API. Immutable, unlike `main`.
          MODEL_COMMIT: '5359861c739e955e79d9a303bcbc70fb988958b1'
          MODEL_SHA256: 'A03779C86DF3323075F5E796CB2CE5029F00EC8869EEE3FDFB897AFE36C6D002'
          MODEL_BYTES: '147964211'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path src-tauri/resources | Out-Null
          $uri = "https://huggingface.co/ggerganov/whisper.cpp/resolve/$($env:MODEL_COMMIT)/ggml-base.en.bin"
          Invoke-WebRequest -Uri $uri -OutFile src-tauri/resources/ggml-base.en.bin
          $size = (Get-Item src-tauri/resources/ggml-base.en.bin).Length
          if ($size -ne [int64]$env:MODEL_BYTES) {
            Write-Host "::error::model size mismatch. expected=$($env:MODEL_BYTES) actual=$size (a truncated download, or an LFS pointer served instead of the blob)"
            exit 1
          }
          $actual = (Get-FileHash src-tauri/resources/ggml-base.en.bin -Algorithm SHA256).Hash
          if ($actual -ne $env:MODEL_SHA256) {
            Write-Host "::error::ggml-base.en.bin checksum mismatch. expected=$($env:MODEL_SHA256) actual=$actual"
            Write-Host "::error::Refusing to sign an installer containing an unverified 147 MB model blob."
            exit 1
          }

      # trusted-signing-cli is deprecated in favor of artifact-signing-cli
      # (same maintainer/repo, same flags) following Microsoft's Trusted
      # Signing -> Artifact Signing rebrand; the RBAC role Azure now assigns
      # is "Artifact Signing Certificate Profile Signer", which the old tool
      # doesn't call the right API surface for.
      - name: Install artifact-signing-cli
        run: cargo install artifact-signing-cli --locked

      # Self-test the signing binary before the real build — catches a
      # broken install or a Mark-of-the-Web block while it's still cheap to
      # fail, instead of discovering it after a 10+ minute Rust compile.
      - name: Self-test signing binary
        shell: pwsh
        run: |
          $cli = (Get-Command artifact-signing-cli).Source
          Unblock-File -Path $cli -ErrorAction SilentlyContinue
          & artifact-signing-cli --help
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::artifact-signing-cli --help exited $LASTEXITCODE - signing binary is broken."
            exit 1
          }

      # --verbose surfaces the real artifact-signing-cli error inline instead
      # of Tauri's generic "failed to run signing command" wrapper.
      - name: Build and sign installer
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          npm run tauri -- build --bundles nsis --config src-tauri/tauri.release.conf.json --verbose

      # Never trust the build-log claim alone — independently confirm the
      # Authenticode signature is present and valid on the actual artifact
      # before it's attached to a release.
      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) {
            Write-Host "::error::No installer found in bundle/nsis output."
            exit 1
          }
          $sig = Get-AuthenticodeSignature -FilePath $installer.FullName
          Write-Host "Signature status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Host "::error::Installer is not validly signed (status: $($sig.Status))."
            exit 1
          }
          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # NOTE on the "untagged-<hash>" URL: this is not a CI race and cannot
      # be fixed by waiting or by swapping tools (tried both -- see git log
      # on this file). It's plain GitHub platform behavior: a *draft*
      # release is never associated with its tag in GitHub's URL routing --
      # only a *published* release gets the clean /releases/tag/vX.Y.Z
      # slug. `gh release view`/`gh api` on a draft will always report
      # "untagged-<random-hash>" for its url and asset download links, no
      # matter how long you wait after the tag push. Confirmed by toggling
      # draft on/off on this exact release: publishing snapped the URL to
      # /releases/tag/v0.1.0 immediately; re-drafting reverted it to a new
      # untagged-<hash> just as fast. See docs/RELEASE.md for the pointer
      # so this doesn't get "fixed" again. tag_name inside the release
      # object is correct throughout -- only the URL slug is affected.
      - name: Create draft release and upload installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          notes_file="$(mktemp)"
          {
            echo "Signed Windows installer for Tahlk ${REF_NAME}."
            echo
            echo "**Before publishing:** run the clean-Windows-VM QA pass described in"
            echo 'docs/RELEASE.md ("Final QA gate") -- record -> transcribe -> generate'
            echo "note -> sign -> export -- then publish this draft."
            echo
            echo "Note: this draft's URL will show an untagged-<hash> slug in the"
            echo "address bar and in the asset download link -- that is expected for"
            echo "any draft release and resolves to the clean v${REF_NAME#v} URL the"
            echo "moment this is published. See docs/RELEASE.md."
          } > "$notes_file"

          gh release create "$REF_NAME" \
            --repo "${{ github.repository }}" \
            --title "Tahlk $REF_NAME" \
            --notes-file "$notes_file" \
            --draft

          gh release upload "$REF_NAME" "${{ env.INSTALLER_PATH }}" \
            --repo "${{ github.repository }}" \
            --clobber

          url="$(gh release view "$REF_NAME" --repo "${{ github.repository }}" --json url -q .url)"
          echo "Draft release ready at $url (will become releases/tag/$REF_NAME once published)"
